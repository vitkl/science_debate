# blog_registry.yaml — per-scientist registry used by search_blogs.py and
# search_youtube.py.
#
# Two supported shapes per scientist:
#
# 1. Legacy flat list (blogs only):
#       Lior Pachter:
#         - https://liorpachter.wordpress.com/
#
# 2. Mapping with optional ``blogs`` + ``youtube_hints``:
#       Eric Davidson:
#         blogs: []
#         youtube_hints:
#           name_variants: ["Eric H. Davidson"]
#           affiliations: ["Caltech", "California Institute of Technology"]
#           topic_aliases: ["sea urchin", "gene regulatory network"]
#
# Both shapes are read by the shared loader in debate/scripts/_registry.py.
# Extend freely. Use search_blogs.py --discover to surface blog candidates.

Lior Pachter:
  - https://liorpachter.wordpress.com/

